syntax = "proto3";

package ptp;

service TimeSync {

    rpc Status (StatusRequest) returns (StatusResponse);
    
    // Note that all followers should be configured before the leader to ensure that they are
    // ready to handle sync messages.
    rpc Configure (ConfigureRequest) returns (ConfigureResponse);

    // Called by the leader node on every follower node after a full PTPv2 sync round trip
    // has occurred to inform the follower of the timings so that it can sync its local clock
    // with the leader.
    rpc Sync (TimeSyncPoint) returns (SyncResponse);
}

message TimeSyncConfig {
    // If present, then this node will propagate the time on its PTP clock to a
    // set of followers.
    LeaderConfig leader = 2;

    // If present, then this node will await packets from a leader and use that
    // data to adjust its local PTP clock.
    FollowerConfig follower = 3;

    // If present, then the local PTP clock will be adjusted by querying a 
    BasicClientConfig basic_client = 4;

    // Parameters to use for syncing the leaders clock to CLOCK_REALTIME.
    TimeAdjustmentConfig realtime_clock_sync = 5;

    reserved 1;
}

message BasicClientConfig {
    string server_addr = 1;

    float sync_interval_seconds = 2;

    TimeAdjustmentConfig clock_sync = 3;

    float max_network_rtt = 4;
}

message LeaderConfig {
    // Number of seconds in between rounds of syncing the local time with all followers.
    float sync_interval_seconds = 1;

    // The addresses of servers to send sync messages to.
    repeated TimeSyncPeerAddr followers = 2;

    float ptp_timeout_seconds = 3;

    float sync_timeout_seconds = 4;

    reserved 5;
}

message FollowerConfig {
    TimeAdjustmentConfig leader_clock_sync = 1;

    // Maximum time spent on the network for a sync offset between the leader and follower to be
    // considered reliable.
    float max_network_rtt = 2;

    float max_sample_age = 3;

    // Rounds whose RTT is more than this many seconds above the smallest RTT of the last
    // 'rtt_min_window' rounds are skipped: their packets waited in a queue on the way, which
    // moves the measured offset by up to half the wait. 0 turns this off.
    float max_rtt_above_min = 4;

    uint32 rtt_min_window = 5;

    // Address ("ip:port") of the leader's PTP socket. When set, the follower answers and uses
    // rounds from this address only, so a replaced leader that is still running can not steer
    // it. Empty accepts rounds from any leader (managers before this field).
    string leader_ptp_addr = 6;
}

message TimeSyncPeerAddr {
    string rpc_addr = 1;
    string ptp_addr = 2;
}

message TimeAdjustmentConfig {
    // The current error in seconds is multiplied by this scaling factor
    // to produce a frequency correction.
    //
    // A p_scale value of 1.0 is scaled such that it would get rid of all the error in 1 second.
    double p_scale = 1;

    double i_scale = 2;

    // If the error exceeds this number of seconds, we will fully reset the current time via
    // clock_settime instead of doing gradual adjustments.
    double max_offset_seconds = 3;

    // Maximum accumulated error in seconds used for calculating the integral term of the PI filter
    // (this is the limit on the sum before it is multiplied by 'i_scale').
    double max_error_integral_secs = 4;

    // Maximum PPM of frequency correction we will do relative to the nominal frequency.
    //
    // This must be larger than the max expected difference in frequencies between the local
    // and remote frequencies (else we may drift continously and require an offset reset at
    // some point)
    double max_correction_ppm = 5;

    // If non-zero, sets a limit to how much the frequency of the clock can change in a single
    // sync round.
    double max_frequency_step_ppm = 6;
}


message StatusRequest {

}

message StatusResponse {
    TimeSyncConfig config = 1;

    FollowerStatus follower = 2;

    FollowerStatus basic_client = 3;

    // Present while TimeSyncNode::set_system_clock_sync() is enabled on this node.
    SystemClockStatus system_clock = 4;

    // Present while this node is a leader.
    LeaderStatus leader = 5;
}

message LeaderStatus {
    repeated LeaderFollowerStatus followers = 1;
}

// The leader's view of one follower.
message LeaderFollowerStatus {
    string rpc_addr = 1;
    string ptp_addr = 2;

    // True once a round with this follower completed: the follower answered the PTP packet and
    // accepted the Sync RPC. A round the follower skipped as queued also counts.
    bool got_round = 3;

    // Seconds since the last completed round.
    double last_round_age = 4;

    // Failed rounds in total, and since the last completed round.
    uint64 num_failures = 5;
    uint64 num_consecutive_failures = 6;

    // Error of the last failed round.
    string last_error = 7;
}

// Steering of this node's system clock (CLOCK_REALTIME) to its PTP clock, the job phc2sys does
// for ptp4l.
message SystemClockStatus {
    // True while the system clock is steered to the PTP clock.
    bool steering = 1;

    // Why the system clock is not steered, when 'steering' is false.
    string reason = 2;

    // PTP clock time minus system clock time in seconds, at the last sample.
    double last_error = 3;

    // Seconds taken to read the two clocks at the last sample.
    double last_read_delay = 4;

    // Seconds since the last sample.
    double last_sample_age = 5;

    // Frequency correction last applied to the system clock, in ppm.
    double freq_ppm = 6;

    // Number of times the system clock was stepped.
    uint64 num_steps = 7;
}

message FollowerStatus {
    bool got_sync = 1;

    // Error between the leader and follower's clocks as predicted by the last PTP round trip.
    double last_leader_error = 2;

    // RTT time in seconds of the last PTP round.
    double last_leader_rtt = 3;

    // Number of seconds since the last successful sync of the follower's time to the leader.
    double last_sync_age = 4;

    // Smallest RTT in seconds over the recent rounds (see FollowerConfig.rtt_min_window).
    double min_rtt = 5;

    // Number of rounds skipped because their RTT was too far above min_rtt.
    uint64 num_queued_rounds = 6;
}

message ConfigureRequest {
    TimeSyncConfig config = 1;
}

message ConfigureResponse {

}

message TimeSyncPoint {
    bytes tx_id = 1;

    uint64 tx_time = 2;

    bytes rx_id = 3;

    uint64 rx_time = 4;
}

message SyncResponse {

}


message TimeSyncPacket {
    bytes ping = 1;
    fixed64 timestamp = 2;
    bool is_reply = 3;
}